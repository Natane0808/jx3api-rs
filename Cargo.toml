[package]
name = "jx3-api"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "JX3API（剑网3 官方数据接口 https://www.jx3api.com）的 Rust SDK"
documentation = "https://docs.rs/jx3-api"
readme = "README.md"
repository = "https://github.com/Natane0808/jx3api-rs"
license = "MIT"
keywords = ["api", "jx3", "jx3-api", "jx3api", "sdk"]
categories = ["api-bindings", "asynchronous", "web-programming"]

# 子表必须紧跟在 [package] 之后：TOML 工具（Tombi）按「首段表名」分组，
# 若中间插入 [dependencies] 等表会被判定为 tables-out-of-order。
[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"

# WebSocket 实时事件（可选）
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"], optional = true }

# TLS 后端由本 crate 的 `rustls-tls` / `native-tls` feature 选择，因此关掉
# reqwest 的默认特性，只保留与 TLS 无关的那几个。
#
# 用依赖子表而非 inline table：Tombi 会按 TOML 1.1 风格把长 inline table 折成多行，
# 而 Cargo 1.85（本 crate 的 MSRV）只接受 TOML 1.0 的「inline table 必须单行」。
[dependencies.reqwest]
version = "0.12.28"
default-features = false
features = ["charset", "http2", "json", "system-proxy"]

[dependencies.tokio-tungstenite]
version = "0.30"
default-features = false
features = ["connect"]
optional = true

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["rustls-tls"]
# 系统 TLS 实现（Windows = schannel，Linux = OpenSSL，macOS = Security.framework）。
# 若与 `rustls-tls` 同时启用，以 native-tls 为准（与 tokio-tungstenite 的优先级一致）。
native-tls = ["reqwest/native-tls", "tokio-tungstenite?/native-tls"]
# 纯 Rust TLS 实现（ring 作为加密后端），读取操作系统根证书。
# 不依赖 schannel / OpenSSL，便于静态链接与无系统证书库的环境。
rustls-tls = ["reqwest/rustls-tls-native-roots", "tokio-tungstenite?/rustls-tls-native-roots"]
# 启用 WebSocket 实时事件推送客户端
websocket = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]
